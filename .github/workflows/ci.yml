name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The workflow-evidence check inspects the commits this branch adds,
          # so it needs history rather than a shallow clone.
          fetch-depth: 0

      # Apple clang compiles; the linters come from the pinned PyPI wheels, the
      # same ones the Linux job installs (ADR-0022). Homebrew's llvm cannot be
      # pinned, so it is no longer installed.
      - name: Install toolchain
        run: brew install ninja ncnn

      - name: Install clang-format and clang-tidy (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/llvm"
          "$RUNNER_TEMP/llvm/bin/pip" install --quiet -r scripts/lint-tools.txt
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/macos-debug/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/GoogleTest.cmake') }}

      - name: Show toolchain
        run: |
          c++ --version | head -1
          clang-format --version
          clang-tidy --version | grep -i 'LLVM version'

      # Runs the exact same entry point developers and agents run locally.
      # This now includes the architecture, determinism, traceability and
      # workflow-evidence gates, so CI and `make check` cannot drift apart.
      - name: Run repository check
        env:
          PIGEON_STRICT_TOOLS: "1"
          PIGEON_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: scripts/check.sh

  # The deployment target is 64-bit Raspberry Pi OS: Linux, glibc, GCC, arm64.
  # GCC-, glibc- and arm64-only defects are invisible on macOS, so the same gate
  # also runs here (ADR-0020).
  check-linux:
    name: check (Linux arm64)
    runs-on: ubuntu-24.04-arm
    env:
      NCNN_TAG: "20260526"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3-venv

      # Pinned in scripts/lint-tools.txt, which check.sh also reads, so this job and
      # a local run use the same versions or say plainly that they do not
      # (ADR-0022). check.sh finds them through PATH.
      - name: Install clang-format and clang-tidy (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/llvm"
          "$RUNNER_TEMP/llvm/bin/pip" install --quiet -r scripts/lint-tools.txt
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"

      # Ubuntu has no ncnn package. It is built once and cached, outside the
      # checkout so the gate never mistakes its headers for project sources. The
      # key hashes this file, so changing the build flags below rebuilds it.
      - name: Cache ncnn
        id: ncnn-cache
        uses: actions/cache@v4
        with:
          path: ~/ncnn-install
          key: ncnn-${{ env.NCNN_TAG }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build ncnn
        if: steps.ncnn-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$NCNN_TAG" https://github.com/Tencent/ncnn.git "$RUNNER_TEMP/ncnn"
          cmake -S "$RUNNER_TEMP/ncnn" -B "$RUNNER_TEMP/ncnn/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/ncnn-install" \
            -DNCNN_SHARED_LIB=OFF -DNCNN_VULKAN=OFF -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_TESTS=OFF -DNCNN_PYTHON=OFF
          cmake --build "$RUNNER_TEMP/ncnn/build"
          cmake --install "$RUNNER_TEMP/ncnn/build"

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/macos-debug/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/GoogleTest.cmake') }}

      - name: Show toolchain
        run: |
          c++ --version | head -1
          cmake --version | head -1
          echo "ncnn tag $NCNN_TAG"
          clang-format --version
          clang-tidy --version | grep -i 'LLVM version'

      # The same entry point as the macOS job. PIGEON_STRICT_TOOLS=1 makes ncnn,
      # clang-format and clang-tidy mandatory, so nothing can be skipped quietly.
      - name: Run repository check
        env:
          PIGEON_STRICT_TOOLS: "1"
          PIGEON_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: CMAKE_PREFIX_PATH="$HOME/ncnn-install" scripts/check.sh

      # check.sh discards configure output, so show which ncnn was linked.
      - name: Show the ncnn the build used
        if: always()
        run: grep '^ncnn_DIR' build/macos-debug/CMakeCache.txt || echo "ncnn_DIR not set"

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install ninja ncnn

      # Undefined behaviour in the safety-critical path must fail the build,
      # not surface on a roof in the rain.
      - name: Build and test under sanitizers
        run: scripts/check.sh --preset macos-asan --skip-format --skip-tidy --skip-workflow
